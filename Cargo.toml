[workspace]
members = [
    "crates/sdkwork-api-models-assembly",
  "crates/sdkwork-models-contract-service",
  "crates/sdkwork-models-catalog-repository-sqlx",
  "crates/sdkwork-models-catalog-service",
  "crates/sdkwork-models-database-host",
  "crates/sdkwork-models-user-config-repository-sqlx",
  "crates/sdkwork-models-agent-config-bridge",
  "crates/sdkwork-api-models-standalone-gateway",
  "crates/sdkwork-models-service-host",
  "crates/sdkwork-routes-catalog-app-api",
  "crates/sdkwork-routes-catalog-backend-api",
  "sdks/sdkwork-models-sdk/sdkwork-models-sdk-rust",
]
resolver = "2"

[workspace.package]
rust-version = "1.85"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
# RUST_CODE_SPEC.md section 13 baseline.
# Deny-tier lints (unsafe_code, panic, unwrap_used, expect_used, pedantic) are
# promoted per crate together with their cleanup: enabling them fleet-wide
# today floods or fails builds that have not paid that debt yet.
unsafe_op_in_unsafe_fn = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"

[workspace.dependencies]
sdkwork-database-sqlx = { path = "../sdkwork-database/crates/sdkwork-database-sqlx", features = ["postgres"] }
sdkwork-database-spi = { path = "../sdkwork-database/crates/sdkwork-database-spi" }
sdkwork-database-lifecycle = { path = "../sdkwork-database/crates/sdkwork-database-lifecycle" }
sdkwork-database-config = { path = "../sdkwork-database/crates/sdkwork-database-config" }
axum = { version = "0.8", default-features = false, features = ["json", "macros", "matched-path", "form", "query", "original-uri"] }
bytes = "1.10"
getrandom = "0.3"
hex = "0.4"
keyring = "4.1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "json", "uuid", "chrono"] }
tokio = { version = "1.51", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
sdkwork-cloudrouter-http = { path = "../sdkwork-cloudrouter/crates/sdkwork-cloudrouter-http" }
sdkwork-database-id = { path = "../sdkwork-database/crates/sdkwork-database-id", package = "sdkwork-database-id", features = ["postgres"] }
sdkwork-utils-rust = { path = "../sdkwork-utils/packages/sdkwork-utils-rust" }
sdkwork-web-core = { path = "../sdkwork-web-framework/crates/sdkwork-web-core" }
sdkwork-web-bootstrap = { path = "../sdkwork-web-framework/crates/sdkwork-web-bootstrap" }
sdkwork-web-axum = { path = "../sdkwork-web-framework/crates/sdkwork-web-axum" }
sdkwork-iam-web-adapter = { path = "../sdkwork-iam/crates/sdkwork-iam-web-adapter" }
sdkwork-models = { path = "sdks/sdkwork-models-sdk/sdkwork-models-sdk-rust" }
sdkwork_models_contract_service = { package = "sdkwork-models-contract-service", path = "crates/sdkwork-models-contract-service" }
sdkwork_models_catalog_repository_sqlx = { package = "sdkwork-models-catalog-repository-sqlx", path = "crates/sdkwork-models-catalog-repository-sqlx" }
sdkwork_models_catalog_service = { package = "sdkwork-models-catalog-service", path = "crates/sdkwork-models-catalog-service" }
sdkwork_models_database_host = { package = "sdkwork-models-database-host", path = "crates/sdkwork-models-database-host" }
sdkwork_models_user_config_repository_sqlx = { package = "sdkwork-models-user-config-repository-sqlx", path = "crates/sdkwork-models-user-config-repository-sqlx" }
sdkwork_api_models_assembly = { package = "sdkwork-api-models-assembly", path = "crates/sdkwork-api-models-assembly" }
sdkwork_models_service_host = { package = "sdkwork-models-service-host", path = "crates/sdkwork-models-service-host" }
sdkwork_routes_models_catalog_app_api = { package = "sdkwork-routes-models-catalog-app-api", path = "crates/sdkwork-routes-catalog-app-api" }
sdkwork_routes_models_catalog_backend_api = { package = "sdkwork-routes-models-catalog-backend-api", path = "crates/sdkwork-routes-catalog-backend-api" }
