# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/models/webserver.pid;
error_log /var/log/sdkwork/models/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name models-staging.sdkwork.com models-staging.birdcoder.com models-staging.dtupay.com models-staging.noaper.com models-staging.sdkwork.cn models-staging.birdcoder.cn models-staging.dtupay.cn models-staging.noaper.cn models-staging.skubc.com models-staging.skubc.cn models-staging.zowalk.com models-staging.zowalk.cn models-staging.offer86.com models-staging.offer86.cn models-staging.86offer.com models-staging.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/models/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
