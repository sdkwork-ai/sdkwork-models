[package]
rust-version.workspace = true
name = "sdkwork-api-models-standalone-gateway"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SDKWork canonical intelligence catalog HTTP route composition for local/private deployments."


[lints]
workspace = true
[lib]
path = "src/lib.rs"

[[bin]]
name = "sdkwork-api-models-standalone-gateway"
path = "src/main.rs"

[dependencies]
axum.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing.workspace = true
tracing-subscriber = "0.3"
sdkwork_api_models_assembly.workspace = true
sdkwork-web-axum.workspace = true
sdkwork-web-bootstrap.workspace = true
sdkwork-web-core.workspace = true
sdkwork-database-sqlx = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1.51", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
